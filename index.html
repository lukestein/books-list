<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luke’s reading list</title>
<meta name="description" content="A personal library of books read. Browse the covers or find a book by title or author.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script defer src="data/books.js"></script><script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#library">Skip to books</a>
<div class="page">
<header class="intro">
<h1>Luke’s reading list</h1>
<p class="description">Books read from Summer 1997 through <span id="updated-month">October 2026</span></p>
</header>
<main>
<section id="library" aria-label="Book collection">
<div class="toolbar"><p id="count" role="status" aria-live="polite"></p><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">Search books by title or author</span><input id="search" type="search" autocomplete="off"></label></div>
<ul class="gallery" id="books"></ul><div id="empty" hidden><h2>No books found.</h2><p>Try another title or author.</p><button id="reset" type="button">Clear search</button></div>
<noscript><p>Enable JavaScript to browse and search the collection, or <a href="data/books.json">view the book list</a>.</p></noscript>
</section>
</main>
<footer><p id="reread-note">* A re-read.</p><p>Cover images from <a href="https://openlibrary.org/">Open Library</a>, <a href="https://books.google.com/">Google Books</a>, and publishers.</p></footer>
</div>
</body></html>
