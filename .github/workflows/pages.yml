name: Deploy reading room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install image optimization dependency
        run: python3 -m pip install Pillow==12.2.0
      - name: Prepare static files
        run: |
          python3 scripts/export.py
          mkdir _site
          cp index.html style.css app.js _site/
          cp -r assets _site/
          mkdir _site/data
          cp data/books.json data/books.js _site/data/
          python3 scripts/optimize-covers.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
